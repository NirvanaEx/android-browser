<!DOCTYPE html>
<html>
<!--
  The page the browser shows when a page didn't arrive.

  Loaded as resource://android/assets/error.html?… — GeckoView maps that scheme
  onto the APK's assets, which is the only way to put a real page in front of a
  failed load: a top-level data: URI is blocked by Gecko, and an about: page
  would need a whole registered protocol handler.

  Everything on it comes in through the query string, already localised by
  ErrorPageInterceptor, because strings belong in strings.xml and not in a file
  the translator will never open. This file holds no text at all.

    t  title        m  message        u  the address that failed
    r  retry label  b  back label

  TWO RULES, both learned by shipping a blank page:

  1. THE CSS AND THE SCRIPT HAVE TO BE SEPARATE FILES. A document loaded from
     resource:// is system-privileged, and Gecko puts a strict CSP on those:
     `default-src resource:; object-src 'none'`, with no 'unsafe-inline'. An
     inline <style> and an inline <script> are both silently dropped — which is
     an unstyled page with nothing written on it. Mozilla's own error page
     (browser-errorpages) links out to error_style.css and errorPageScripts.js
     for exactly this reason. The meta below only states what is enforced
     anyway, so that the next person editing this file can see it.

  2. THE QUERY IS ON document.documentURI, NOT ON location. Gecko loads this
     with LOAD_ERROR_PAGE, which is what keeps the address bar showing the
     address the user asked for — so `location.href` is the FAILED page and its
     query string is whatever that URL had. Reading location.search gets you
     someone else's parameters or, far more often, none at all.
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src resource:; object-src 'none'">
  <title></title>
  <link rel="stylesheet" href="error.css">
</head>
<body>
  <main>
    <div class="mark">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2 1 21h22L12 2zm1 14h-2v2h2v-2zm0-7h-2v5h2V9z"/>
      </svg>
    </div>
    <h1 id="title"></h1>
    <p id="body"></p>
    <div class="url" id="url"></div>
    <div class="row">
      <button id="retry" type="button"></button>
      <button id="back" type="button"></button>
    </div>
  </main>
  <script src="error.js"></script>
</body>
</html>
