# Android CI — builds a debug APK on every push to main (and on demand via
# the "Run workflow" button on the Actions tab).
#
# Two ways to get the APK:
#   1. Releases page (easiest from a phone): every main push updates the
#      rolling "latest-debug" pre-release with a direct .apk link —
#      https://github.com/NirvanaEx/android-browser/releases
#   2. Actions tab → pick a run → "Artifacts" (requires GitHub login,
#      downloads as a zip).
#
# Only the arm64-v8a APK is published — that's what real phones run. The
# x86_64 build for emulators is still produced locally by assembleDebug.

name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write # update the rolling latest-debug release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: upgrid-browser-arm64-debug
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          retention-days: 14

      - name: Update rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest debug build
          prerelease: true
          body: |
            Автосборка из последнего коммита в main.
            Скачай `app-arm64-v8a-debug.apk` и установи (нужно разрешить
            установку из неизвестных источников).
          files: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
