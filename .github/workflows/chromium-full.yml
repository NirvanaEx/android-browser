name: Upgrid full cloud APK
on:
  push:
    branches: [codex/chromium-distributed]
    paths:
      - .github/workflows/chromium-full.yml
      - tools/chromium/ci/**
  workflow_dispatch:
    inputs:
      mode:
        description: Validate tooling or build the complete APK
        type: choice
        options: [build, validate]
        default: build
      cache_tag:
        description: auto selects a completed compatible cache; empty forces a cold build
        type: string
        default: auto
      shards:
        description: Number of native compilation shards (1 to 40)
        type: number
        default: 40
permissions:
  contents: read
concurrency:
  group: upgrid-full-cloud-${{ github.ref }}
  cancel-in-progress: false
env:
  UPGRID_CHROMIUM_ROOT: /home/neyron/.cache/upgrid/chromium
  UPGRID_DISTRIBUTED_STATE: /home/runner/upgrid-state
  DEPOT_TOOLS_UPDATE: '0'
  GCLIENT_PY3: '1'
jobs:
  validate:
    if: github.ref == 'refs/heads/codex/chromium-distributed'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build zstd
          python3 -m unittest discover -s tools/chromium/ci/tests -v
          UPGRID_TEST_NINJA=ninja python3 tools/chromium/distributed/test_cache.py
  prepare:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      plan_sha256: ${{ steps.prepare.outputs.plan_sha256 }}
      matrix: ${{ steps.prepare.outputs.matrix }}
      actions: ${{ steps.prepare.outputs.actions }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare disposable build runner
        run: bash tools/chromium/ci/setup-runner.sh
      - name: Prepare complete source, native dependencies, and immutable snapshots
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_TAG: ${{ inputs.cache_tag }}
          SHARDS: ${{ inputs.shards }}
        run: python3 -u tools/chromium/ci/pipeline.py prepare --cache-tag "$CACHE_TAG" --shards "$SHARDS"
  native:
    needs: prepare
    if: needs.prepare.outputs.actions != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: write
      checks: write
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create isolated compiler directory
        run: |
          test ! -e /home/neyron
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$UPGRID_CHROMIUM_ROOT"
          mkdir -p "$UPGRID_DISTRIBUTED_STATE"
      - name: Compile native shard and return checked outputs
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_TAG: ${{ needs.prepare.outputs.tag }}
          PLAN_SHA256: ${{ needs.prepare.outputs.plan_sha256 }}
          WORKER: ${{ matrix.worker }}
        run: python3 -u tools/chromium/ci/pipeline.py worker --tag "$TRANSFER_TAG" --plan-sha256 "$PLAN_SHA256" --worker "$WORKER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-worker-${{ matrix.worker }}-diagnostics
          path: |
            /home/runner/upgrid-state/result.json
            /home/runner/upgrid-state/worker.log
          retention-days: 1
          if-no-files-found: ignore
  apk:
    needs: [prepare, native]
    if: always() && needs.prepare.result == 'success' && (needs.native.result == 'success' || needs.native.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tools/chromium/ci/setup-runner.sh
      - name: Assemble, verify signed APK, and save incremental cache
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_TAG: ${{ needs.prepare.outputs.tag }}
          PLAN_SHA256: ${{ needs.prepare.outputs.plan_sha256 }}
        run: python3 -u tools/chromium/ci/pipeline.py finalize --tag "$TRANSFER_TAG" --plan-sha256 "$PLAN_SHA256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-apk-verification
          path: |
            /home/runner/upgrid-state/apk-verification.json
            /home/runner/upgrid-state/import-receipt.json
            /home/runner/upgrid-state/remaining-tasks.log
            /home/neyron/.cache/upgrid/chromium/upgrid-extensions-dev-build-receipt.json
          retention-days: 7
          if-no-files-found: ignore
