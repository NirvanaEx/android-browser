<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chromium player entry points</title>
<style>
  body { margin: 12px; background: #eef2f6; color: #152333; font: 16px system-ui; }
  button, a { display: inline-block; padding: 14px; margin: 3px; }
  video { display: block; width: 100%; height: 230px; background: #000; }
  #player { background: #000; }
  #player:fullscreen { display: flex; flex-direction: column; width: 100%; height: 100%; }
  #player:fullscreen video { flex: 1; width: 100%; height: 0; min-height: 0; object-fit: contain; }
  #player:fullscreen .site { color: white; flex: none; padding: 10px; }
  #plain { padding: 30px; background: #354f72; color: white; }
  #plain:fullscreen { padding: 30px; }
  iframe { width: 100%; height: 540px; border: 0; }
</style>
<h2>Player entry points</h2>
<nav>
  <a href="?mode=direct">Direct video</a>
  <a href="?mode=container">Site container</a>
  <a href="?mode=novideo">Fullscreen without video</a>
  <a href="?mode=frame">Iframe</a>
  <a href="?mode=sourcechange">Source replacement in fullscreen</a>
  <a href="?mode=shadow">Shadow player</a>
</nav>
<div id="player">
  <video id="video" src="/sample.mp4" controls loop playsinline></video>
    <div class="site">Site controls inside container</div>
</div>
<p>
  <button id="play">Start video</button>
  <button id="pause">Pause video</button>
  <button id="fullscreen">Site fullscreen</button>
</p>
<div id="plain" hidden>Fullscreen test without any video</div>
<pre id="status"></pre>
<script>
  const mode = new URLSearchParams(location.search).get('mode') || 'direct';
  const video = document.getElementById('video');
  const player = document.getElementById('player');
  const plain = document.getElementById('plain');
  const status = document.getElementById('status');
  let loads = 0, pauses = 0;
  video.addEventListener('loadstart', () => ++loads);
  video.addEventListener('pause', () => ++pauses);
  function observe(kind) {
    const event = {kind: `${mode}-${kind}`, time: video.currentTime,
      paused: video.paused, fullscreen: !!document.fullscreenElement, loads, pauses,
      fit: getComputedStyle(video).objectFit, videoWidth: video.videoWidth, videoHeight: video.videoHeight,
      siteUiVisible: [...player.querySelectorAll('.site')].some(node => !!node.getClientRects().length),
      videoRect: {width: video.getBoundingClientRect().width, height: video.getBoundingClientRect().height}};
    status.textContent = JSON.stringify(event, null, 2);
    fetch('/probe-events', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(event)}).catch(() => {});
  }
  document.getElementById('play').onclick = () => video.play().catch(error => {
    status.textContent = error.name;
  });
  document.getElementById('pause').onclick = () => video.pause();
  document.getElementById('fullscreen').onclick = () => {
    observe('before');
    const target = ['container', 'sourcechange', 'shadow'].includes(mode) ? player : mode === 'novideo' ? plain : video;
    target.hidden = false;
    target.requestFullscreen().catch(error => { status.textContent = error.name; observe('rejected'); });
  };
  document.addEventListener('fullscreenchange', () => observe(document.fullscreenElement ? 'entered' : 'left'));
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) return;
    setTimeout(() => {
      if (document.fullscreenElement !== player) return;
      const controls = document.createElement('div');
      controls.className = 'site';
      controls.textContent = 'Late site controls';
      controls.style.cssText = 'display:block!important;position:fixed;bottom:0;z-index:2147483647;color:red';
      player.appendChild(controls);
    }, 700);
    if (mode === 'sourcechange') setTimeout(() => {
      video.src = '/sample.mp4?replacement=1';
      video.load();
    }, 3000);
  });
  setInterval(() => observe('tick'), 1000);
  if (mode === 'frame') {
    document.querySelectorAll('button').forEach(button => button.hidden = true);
    player.hidden = true;
    const frame = document.createElement('iframe');
    frame.src = '/chromium-fullscreen.html?mode=container';
    frame.allowFullscreen = true;
    document.body.appendChild(frame);
  }
  if (mode === 'shadow') {
    const host = document.createElement('div');
    const shadow = host.attachShadow({mode: 'open'});
    const style = document.createElement('style');
    style.textContent = 'video{display:block;width:100%;height:230px}';
    shadow.append(style, video);
    const controls = document.createElement('div');
    controls.className = 'site';
    controls.textContent = 'Shadow site controls';
    shadow.appendChild(controls);
    player.prepend(host);
  }
</script>
</html>
